schema_version: 1
notes:
  design: Trois milieux alignés sur species.environment. Des spots plus précis pourront
    s'ajouter plus tard sans changer les clés existantes.
milieus:
- id: 1
  key: ocean
  name: Océan
  description: "Eaux salées, de la côte jusqu'au large, où le temps change plus vite que le fond."
- id: 2
  key: river
  name: Rivière
  description: "Le courant, les berges, et tout ce qui remonte ou descend avec l'eau."
- id: 3
  key: pond
  name: Étang
  description: "Une eau calme, presque fermée, où l'on pêche sans jamais tout à fait voir le fond."
