schema_version: 1
balance_status: provisional
notes:
  asset_order: left_to_right_top_to_bottom
  asset_naming: item<index>.png
  shadow_naming: item<index>_s.png
  active_slots:
  - tool
  - hook
  - bait
  - objet
  base_tools: Les cannes, le filet et plus tard l'équipement de plongée sont donnés de base,
    sans durabilité, et ne s'achètent pas.
  hook_durability: Durabilité à l'utilisation (ferrage).
  passive_durability: Durabilité en jours IRL (longue), pas à l'usage.
  passive_items_rule: Un seul objet passif actif à la fois, via le slot `objet`
    (équipé depuis /profil). Les autres restent dans le sac, sans effet.
  jack_o_lantern_ignored_for_now: true
  skull_summon_threshold: null
