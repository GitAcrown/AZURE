      name: Pluie
      emoji: "🌧️"
    - key: storm
      name: Tempête
      emoji: "⛈️"
    - key: fog
      name: Brouillard
      emoji: "🌫️"
    - key: wind
      name: Vent
      emoji: "🌬️"
