schema_version: 1
notes:
  design: Valeurs de départ provisoires. L'argent est stocké en bronze.
  world: Timezone unique pour l'instant. Saison et moment partagés ; météo par milieu,
    déterministe (guild + milieu + palier horaire).
money:
  bronze_per_silver: 100
  silver_per_gold: 100
